[package]
name = "windtable"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-native-tls",
    "postgres",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
dotenvy = "0.15"
rand = "0.8"
argon2 = "0.5"
rand_core = "0.6"
nanoid = "0.5"
indexmap = "2.14"

[[bin]]
name = "windtable"
path = "src/main.rs"


[profile.release]
lto = true
codegen-units = 1
strip = true
